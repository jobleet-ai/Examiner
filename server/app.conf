upstream backend {
   server localhost:4444;
   keepalive 32;
}
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;
server {
   listen 443 ssl;
   ssl_certificate /home/admin/ssl/domain.cert.pem;
   ssl_trusted_certificate /home/admin/ssl/intermediate.cert.pem;
   ssl_certificate_key /home/admin/ssl/private.key.pem;

   server_name 65.0.125.63 a.joblient.com joblient.com www.joblient.com ec2-65-0-125-63.ap-south-1.compute.amazonaws.co>
   location / {
       limit_req zone=mylimit burst=10 nodelay;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_http_version 1.1;
       proxy_pass http://127.0.0.1:4444;
   }
}
server {
   listen 80;
   server_name 65.0.125.63 a.joblient.com joblient.com www.joblient.com;
   return 301 https://$host$request_uri;
}